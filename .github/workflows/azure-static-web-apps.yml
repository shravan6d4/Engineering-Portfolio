name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build here rather than letting Azure's Oryx builder do it. Oryx
      # auto-detects Next.js and tries a hybrid/SSR deployment, which is a
      # paid Standard-plan feature. This project is a pure static export
      # (output: "export"), so we build it ourselves and upload the result.
      - name: Build static export
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Deploy to Azure
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          # With skip_app_build, app_location points at the already-built output.
          app_location: "out"
          skip_app_build: true
          skip_api_build: true
